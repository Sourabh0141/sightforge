name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.contracts == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.contracts == 'true' }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
              - 'config/defaults.json'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'turbo.json'
            python:
              - 'services/**'
              - 'pyproject.toml'
              - 'uv.lock'
            terraform:
              - 'infra/terraform/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'LICENSE'

  security-scan:
    name: Security & Secret Scan (Gitleaks, Audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Local Regex Secret Audit
        run: node scripts/audit-secrets.cjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Audit Node / TypeScript Dependencies
        run: pnpm audit --audit-level=high || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python Dependencies
        run: |
          uv sync --locked --all-packages --all-groups --all-extras
          uv run pip-audit

  typescript-checks:
    name: TypeScript & Worker Checks (Lint, Types, Tests, Build)
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Contract Drift Check (TypeScript)
        run: |
          pnpm run contracts:generate:ts
          git diff --exit-code packages/contracts/src/generated

      - name: Run Linters & Typecheck
        run: pnpm turbo run lint typecheck

      - name: Run Worker & Package Tests
        run: pnpm turbo run test

      - name: Run Builds
        run: pnpm turbo run build

  python-checks:
    name: Python Inference Checks (Ruff, Mypy, Pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked --all-packages --all-groups --all-extras

      - name: Contract Drift Check (Python)
        run: |
          uv run datamodel-codegen --input packages/contracts/schemas/result.schema.json --output services/inference/src/sightforge_inference/contracts/result.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.11 --use-annotated
          uv run ruff format services/inference
          git diff --exit-code services/inference/src/sightforge_inference/contracts

      - name: Lint Check (Ruff)
        run: uv run ruff check services/inference

      - name: Format Check (Ruff)
        run: uv run ruff format --check services/inference

      - name: Typecheck (Mypy)
        run: uv run mypy services/inference

      - name: Run Pytest
        run: uv run pytest services/inference

  # The unconditional Aggregator check (Single Required Status Check for Branch Protection)
  ci-aggregator:
    name: CI Aggregator (Required Check)
    needs:
      - detect-changes
      - security-scan
      - typescript-checks
      - python-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Upstream Job Results
        shell: bash
        run: |
          echo "=================================================="
          echo "           CI AGGREGATOR EVALUATION               "
          echo "=================================================="
          echo "detect-changes:     ${{ needs.detect-changes.result }}"
          echo "security-scan:      ${{ needs.security-scan.result }}"
          echo "typescript-checks:  ${{ needs.typescript-checks.result }}"
          echo "python-checks:      ${{ needs.python-checks.result }}"
          echo "=================================================="

          RESULTS=(
            "${{ needs.detect-changes.result }}"
            "${{ needs.security-scan.result }}"
            "${{ needs.typescript-checks.result }}"
            "${{ needs.python-checks.result }}"
          )

          FAILED=0
          for result in "${RESULTS[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Error: Found failed or cancelled job result: $result"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "❌ CI AGGREGATOR RESULT: FAILED"
            echo "One or more required upstream checks failed or were cancelled."
            exit 1
          fi

          echo ""
          echo "✅ CI AGGREGATOR RESULT: SUCCESS"
          echo "All checks either passed successfully or were legitimately skipped."
          exit 0
