name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.contracts == 'true' }}
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.contracts == 'true' }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            contracts:
              - 'packages/contracts/**'
              - 'config/defaults.json'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'turbo.json'
            python:
              - 'services/**'
              - 'pyproject.toml'
              - 'uv.lock'
            terraform:
              - 'infra/**'
              - '.tflint.hcl'
              - 'scripts/audit-infra-policy.cjs'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'LICENSE'

  security-scan:
    name: Security & Secret Scan (Gitleaks, Audits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run Local Regex Secret Audit
        run: node scripts/audit-secrets.cjs

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Audit Node / TypeScript Dependencies
        run: pnpm audit --audit-level=high || true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python Dependencies
        run: |
          uv sync --locked --all-packages --all-groups --all-extras
          uv run pip-audit

  typescript-checks:
    name: TypeScript & Worker Checks (Lint, Types, Tests, Build)
    needs: detect-changes
    if: needs.detect-changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Contract Drift Check (TypeScript)
        run: |
          pnpm run contracts:generate:ts
          git diff --exit-code packages/contracts/src/generated

      - name: Run Linters & Typecheck
        run: pnpm turbo run lint typecheck

      - name: Run Worker & Package Tests
        run: pnpm turbo run test

      - name: Run Builds
        run: pnpm turbo run build

  python-checks:
    name: Python Inference Checks (Ruff, Mypy, Pytest)
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked --all-packages --all-groups --all-extras

      - name: Contract Drift Check (Python)
        run: |
          uv run datamodel-codegen --input packages/contracts/schemas/result.schema.json --output services/inference/src/sightforge_inference/contracts/result.py --output-model-type pydantic_v2.BaseModel --target-python-version 3.11 --use-annotated --disable-timestamp
          uv run ruff format services/inference
          git diff --exit-code services/inference/src/sightforge_inference/contracts

      - name: Lint Check (Ruff)
        run: uv run ruff check services/inference

      - name: Format Check (Ruff)
        run: uv run ruff format --check services/inference

      - name: Typecheck (Mypy)
        run: uv run mypy services/inference

      - name: Run Pytest
        run: uv run pytest services/inference

  terraform-checks:
    name: Terraform Checks (Fmt, Validate, TFLint, Trivy, Plan)
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/terraform

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Terraform Init (No Backend)
        run: terraform -chdir=infra/terraform/environments/prod init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/environments/prod validate

      - name: Run Trivy IaC Configuration Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "infra/terraform"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run Custom Cloudflare Security Policy Scanner (R88)
        run: node scripts/audit-infra-policy.cjs

      - name: Evaluate Fork & Credential Environment (KTD3)
        id: env_check
        shell: bash
        run: |
          IS_INTERNAL="true"
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            IS_INTERNAL="false"
          fi
          echo "is_internal=${IS_INTERNAL}" >> "$GITHUB_OUTPUT"
          echo "Is internal repository PR/push: ${IS_INTERNAL}"

      - name: Generate Speculative Terraform Plan (Internal PR / Push)
        if: steps.env_check.outputs.is_internal == 'true'
        shell: bash
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'dummy-account-id-for-ci-plan' }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p infra/terraform/plan-output
          cat << 'EOF' > infra/terraform/plan-output/plan-summary.md
          ### 🌐 Terraform Speculative Plan Summary (`prod`)

          - **Configuration:** `infra/terraform/environments/prod`
          - **Status:** Validated, formatted, linted, and policy-checked.
          - **Apply Mode:** Gated behind environment approval in Deployment pipeline (P5 U5).
          EOF

      - name: Notice for External Forked Pull Requests (KTD3)
        if: steps.env_check.outputs.is_internal == 'false'
        shell: bash
        run: |
          mkdir -p infra/terraform/plan-output
          cat << 'EOF' > infra/terraform/plan-output/plan-summary.md
          ### 🔒 Terraform Speculative Plan Notice (`prod`)

          > [!NOTE]
          > **Forked pull request detected (KTD3).**
          > Static checks (`fmt`, `validate`, `tflint`, Trivy, and custom policy audit) passed with zero errors.
          > Credentialed speculative planning and remote state access are safely deferred to repository maintainers.
          EOF

      - name: Publish Plan Summary to Step Summary
        shell: bash
        run: |
          if [ -f infra/terraform/plan-output/plan-summary.md ]; then
            cat infra/terraform/plan-output/plan-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Speculative Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-prod-plan
          path: infra/terraform/plan-output/
          retention-days: 7

  # The unconditional Aggregator check (Single Required Status Check for Branch Protection)
  ci-aggregator:
    name: CI Aggregator (Required Check)
    needs:
      - detect-changes
      - security-scan
      - typescript-checks
      - python-checks
      - terraform-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Upstream Job Results
        shell: bash
        run: |
          echo "=================================================="
          echo "           CI AGGREGATOR EVALUATION               "
          echo "=================================================="
          echo "detect-changes:     ${{ needs.detect-changes.result }}"
          echo "security-scan:      ${{ needs.security-scan.result }}"
          echo "typescript-checks:  ${{ needs.typescript-checks.result }}"
          echo "python-checks:      ${{ needs.python-checks.result }}"
          echo "terraform-checks:   ${{ needs.terraform-checks.result }}"
          echo "=================================================="

          RESULTS=(
            "${{ needs.detect-changes.result }}"
            "${{ needs.security-scan.result }}"
            "${{ needs.typescript-checks.result }}"
            "${{ needs.python-checks.result }}"
            "${{ needs.terraform-checks.result }}"
          )

          FAILED=0
          for result in "${RESULTS[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Error: Found failed or cancelled job result: $result"
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "❌ CI AGGREGATOR RESULT: FAILED"
            echo "One or more required upstream checks failed or were cancelled."
            exit 1
          fi

          echo ""
          echo "✅ CI AGGREGATOR RESULT: SUCCESS"
          echo "All checks either passed successfully or were legitimately skipped."
          exit 0
