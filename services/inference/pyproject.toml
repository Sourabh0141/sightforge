[project]
name = "sightforge-inference"
version = "0.1.0"
description = "SightForge computer vision inference service on Modal Labs"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "modal>=0.73.0",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.3.0",
    "opencv-python-headless>=4.10.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightforge_inference"]
